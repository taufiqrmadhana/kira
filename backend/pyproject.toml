[project]
name = "kira-backend"
version = "0.1.0"
description = "KIRA payment reconciliation platform and assistant"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.38,<1",
  "sqlalchemy>=2.0,<3",
  "google-adk==2.12.0",
  "litellm==1.106.2",
  "mcp==2.3.0",
  "aiosqlite>=0.21,<1",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "greenlet>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kira"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
